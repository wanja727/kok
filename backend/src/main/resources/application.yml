spring:
  application:
    name: retrievo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  session:
    # 세션 테이블은 Flyway(V4)가 만든다
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          kakao:
            # 카카오 개발자 앱의 REST API 키와 Client Secret. 없으면 로그인만 안 되고 서버는 뜬다
            client-id: ${KAKAO_CLIENT_ID:not-configured}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # 프론트 주소로 돌아온다. 프론트가 /login/oauth2/**를 백엔드로 넘긴다 (같은 도메인 쿠키, ADR-010)
            redirect-uri: ${retrievo.public-url}/login/oauth2/code/kakao
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  servlet:
    session:
      # 매일 쓰는 앱이라 한 번 로그인하면 30일 동안 유지한다
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax

retrievo:
  # 사용자가 보는 프론트 주소. 로그인 뒤 돌아갈 곳과 카카오 redirect URI를 만든다
  public-url: ${RETRIEVO_PUBLIC_URL:http://localhost:3000}
  auth:
    # 개발용 임시 로그인: X-Dev-User-Id 헤더로 사용자를 정한다. 로컬과 테스트에서만 켠다
    dev-header: false
