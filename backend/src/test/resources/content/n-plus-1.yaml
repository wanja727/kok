# 테스트용 문제 파일. 형식은 docs/content-format.md
subject:
  key: dev
  name: 개발자 면접

lesson:
  key: n-plus-1
  title: N+1 문제
  unit: JPA
  order: 6

concepts:
  - key: lazy-loop
    name: 지연 로딩 컬렉션을 루프에서 읽을 때 생기는 추가 쿼리
  - key: fetch-join
    name: 페치 조인으로 한 번에 읽기

questions:
  - key: lazy-loop-count
    concept: lazy-loop
    type: multiple_choice
    status: reviewed
    difficulty: 2
    body: 팀 10개를 조회한 뒤 각 팀의 members(LAZY)를 루프에서 읽으면 SELECT는 모두 몇 번 실행될까?
    choices:
      - 1번
      - 2번
      - 10번
      - 11번
    answer: 4
    explanation: 팀 목록 1번, 팀마다 members 1번씩 10번. 합쳐서 11번이다.
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching

  - key: lazy-loop-ox
    concept: lazy-loop
    type: ox
    status: reviewed
    difficulty: 1
    body: FetchType.EAGER로 바꾸면 N+1 문제가 사라진다.
    answer: X
    explanation: JPQL로 목록을 조회하면 EAGER여도 연관 엔티티를 따로 조회해서 N+1이 그대로 생긴다.
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching-strategies

  - key: fetch-join-predict
    concept: fetch-join
    type: code_predict
    status: reviewed
    difficulty: 2
    body: 아래 코드를 실행하면 SELECT는 몇 번 실행될까?
    code: |
      List<Team> teams = em.createQuery(
          "select t from Team t join fetch t.members", Team.class)
          .getResultList();
      teams.forEach(t -> t.getMembers().size());
    choices:
      - 1번
      - 2번
      - 11번
    answer: 1
    explanation: 페치 조인은 팀과 멤버를 조인 한 번으로 함께 읽는다.
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#hql-explicit-fetch-join

  - key: fetch-join-explain
    concept: fetch-join
    type: descriptive
    status: reviewed
    difficulty: 2
    body: N+1 문제가 무엇이고 어떻게 해결하는지 면접에서 답하듯 설명해 보세요.
    explanation: 목록 조회 1번 뒤에 항목마다 연관 조회가 N번 더 나가는 문제다.
    checklist:
      - 목록 조회 1번 + 항목마다 추가 조회 N번이라고 말했다
      - 지연 로딩 컬렉션을 루프에서 읽을 때 생긴다고 말했다
      - 페치 조인으로 한 번에 읽는 방법을 말했다
      - 배치 크기(default_batch_fetch_size)로 IN 조회로 묶는 방법을 말했다
    source: https://docs.jboss.org/hibernate/orm/6.6/userguide/html_single/Hibernate_User_Guide.html#fetching-batch
